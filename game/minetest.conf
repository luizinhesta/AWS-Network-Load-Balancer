# =============================================================================
# Configuração do Servidor Luanti (Minetest)
# Projeto: AWS Luanti ALB/NLB Lab
# =============================================================================

# === Rede ===
port = 30000
server_address = 0.0.0.0
ipv6_server = false

# === Identificação do Servidor ===
server_name = AWS Luanti ALB/NLB Lab Server
server_description = Servidor de estudo e laboratório - Projeto AWS com ALB e NLB
motd = Bem-vindo ao servidor AWS Luanti ALB/NLB Lab! Este servidor faz parte de um projeto de estudo sobre Load Balancers na AWS.

# === Jogadores ===
max_users = 10
strict_protocol_checking = false
enable_pvp = true

# === Gameplay ===
creative_mode = false
enable_damage = true
default_game = minetest_game
default_privs = interact, shout

# === Mundo ===
default_password =
static_spawnpoint = 0, 10, 0

# === Desempenho ===
max_simultaneous_block_sends_per_client = 10
max_block_send_distance = 10
active_block_range = 3
server_map_save_interval = 15

# === Segurança ===
disallow_empty_password = false
enable_rollback_recording = false

# === Logs ===
debug_log_level = action
